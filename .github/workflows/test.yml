# CI workflow for abcMIDI.
#
# Runs the CMake-based test suite (smoke + golden-file tests) on every push
# and pull request against the long-lived branches, and can also be triggered
# manually from the GitHub UI or via `gh workflow run test.yml`.
#
# Status badge: see the [![Tests]] link at the top of README.md.

name: Tests

on:
  # Run on pushes to the main development branches.
  push:
    branches: [master, future]
  # Run on PRs targeting those same branches.
  pull_request:
    branches: [master, future]
  # Allow manual runs on any branch from the Actions tab or `gh workflow run`.
  workflow_dispatch:

# Minimal permissions: the workflow only needs to read the repository contents.
permissions:
  contents: read

jobs:
  test-msys2:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure
        run: cmake --preset default
      - name: Build
        run: cmake --build --preset default
      - name: Test
        run: ctest --preset default --output-on-failure

  test:
    runs-on: ubuntu-latest

    # One parallel job per tool.  GitHub Actions only exposes a single badge
    # per workflow file, so this matrix produces one aggregate "Tests" badge
    # but still gives per-tool visibility in the Actions UI and lets a single
    # tool failure be diagnosed without scrolling through unrelated output.
    strategy:
      # Keep running the other tools even if one fails, so a single
      # regression does not hide unrelated breakage.
      fail-fast: false
      matrix:
        tool:
          - abc2midi
          - abc2abc
          - midi2abc
          - midistats
          - mftext
          - yaps
          - midicopy
          - abcmatch

    # Job display name in the Actions UI (e.g. "Tests / abc2midi").
    name: ${{ matrix.tool }}

    steps:
      # `persist-credentials: false` avoids leaving a GITHUB_TOKEN in the
      # local git config — defence in depth against a later step that might
      # inadvertently push or call the API on our behalf.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Configure with the `default` preset (Release build, see CMakePresets.json).
      - name: Configure
        run: cmake --preset default

      # Build every binary.  Each matrix job builds the full set rather than
      # just `${{ matrix.tool }}` because several tools depend on others at
      # test time: the golden tests for abc2midi / midistats / midicopy pipe
      # their output through mftext, and midi2abc / midistats / midicopy are
      # exercised on a MIDI file produced on-the-fly by abc2midi.  Building
      # everything keeps the test dispatch logic in tests/run_test.cmake
      # simple and matches what a developer runs locally.
      - name: Build
        run: cmake --build --preset default

      # Run only the tests relevant to this matrix tool.  The regex matches:
      #   - the smoke test          smoke_<tool>_ver
      #   - every golden test       <tool>_<sample>
      # (see tests/CMakeLists.txt for the naming convention).
      - name: Test ${{ matrix.tool }}
        run: ctest --preset default -R '^(smoke_${{ matrix.tool }}_ver|${{ matrix.tool }}_)'

  # Memory-safety gate: build with the `sanitize` preset (AddressSanitizer +
  # UndefinedBehaviorSanitizer, see CMakePresets.json) and run the golden
  # suite instrumented, so heap-buffer-overflows, use-after-free, and UB abort
  # the run instead of silently producing plausible output.  This is the job
  # that would have caught the %%MIDI beatstring heap-buffer-overflow: the
  # Release build above renders that input without complaint, only ASan turns
  # the one-byte over-read into a hard failure.
  #
  # The whole suite runs clean under the sanitizers now.  If a fix is not yet
  # ready and a test has to be quarantined to keep the gate green, exclude it
  # by name with an anchored regex, e.g.
  #   ctest --preset sanitize -E '^(some_test|other_test)$'
  # (anchoring keeps e.g. abc2midi_detune_2 running when abc2midi_detune is
  # excluded), and list the reason here so it is not forgotten.
  test-sanitize:
    runs-on: ubuntu-latest
    name: sanitize (ASan+UBSan)
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset sanitize
      - name: Build
        run: cmake --build --preset sanitize
      - name: Test (sanitizers)
        run: ctest --preset sanitize

  # Informational comparison with abc2svg, the reference for playback
  # questions such as microtones (GitHub issue #56).  tests/compare_abc2svg.py
  # renders every tune of the samples with both programs and reports in the
  # job summary where the pitches they play differ.  A difference never fails
  # the job, and continue-on-error keeps a download or build problem from
  # failing the workflow.
  #
  # abc2svg is built from a pinned check-in of its fossil repository.  To move
  # to a newer one, set ABC2SVG_CHECKIN to its hash and ABC2SVG_SHA256 to the
  # sha256sum of the tarball that the URL below then serves.
  compare-abc2svg:
    runs-on: ubuntu-latest
    name: compare with abc2svg (informational)
    continue-on-error: true
    env:
      ABC2SVG_CHECKIN: f1fdd410d44dbdba56558b5da1a29402c01a4183
      ABC2SVG_SHA256: 4079d93938c7f7be0c00afc94794d63d5ee32bf070a010a385bbc49df7e03e52
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset default
      - name: Build
        run: cmake --build --preset default --target abc2midi mftext
      # NOMIN=1 skips the minification, which needs jsmin, qjs or uglifyjs.
      - name: Fetch and build abc2svg
        run: |
          curl -sSfL -o "$RUNNER_TEMP/abc2svg.tar.gz" \
            "https://chiselapp.com/user/moinejf/repository/abc2svg/tarball/$ABC2SVG_CHECKIN/abc2svg.tar.gz"
          echo "$ABC2SVG_SHA256  $RUNNER_TEMP/abc2svg.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/abc2svg.tar.gz" -C "$RUNNER_TEMP"
          command -v ninja || { sudo apt-get update && sudo apt-get install -y ninja-build; }
          cd "$RUNNER_TEMP/abc2svg" && NOMIN=1 ninja
      - name: Compare
        run: >-
          python3 tests/compare_abc2svg.py
          --abc2midi build/default/abc2midi
          --mftext build/default/mftext
          --abc2svg "$RUNNER_TEMP/abc2svg"
          samples/*.abc
